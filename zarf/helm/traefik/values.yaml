# Local Traefik configuration for the ledger Kind cluster

service:
  type: ClusterIP

ingressClass:
  enabled: false

providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

updateStrategy:
  type: Recreate

ports:
  web:
    port: 80
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    hostPort: 443
    http:
      tls:
        enabled: true
