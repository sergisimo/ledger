version: v2
modules:
  - path: internal/platform/gateway/rpc/proto
  - path: internal/platform/gateway/rpc/rpctest/proto
  - path: internal/platform/resource/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
