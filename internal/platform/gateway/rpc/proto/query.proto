syntax = "proto3";

package platform.rpc.v1;

option go_package = "github.com/sergisimo/ledger/internal/platform/gateway/rpc/rpcpb";

message Page {
  uint32 limit = 1;
  uint32 offset = 2;
}

message Sort {
  string field = 1;
  bool desc = 2;
}

message ListMeta {
  uint32 total_count = 1;
}

message IDQuery {
  string id = 1;
}
